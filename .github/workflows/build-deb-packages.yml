name: Build DEB Packages

on:
  push:
    branches:
      - yanet
    tags:
      - "v*"
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  LC_ALL: C.UTF-8

jobs:
  build-packages:
    name: Build Ubuntu ${{ matrix.ubuntu-version }} DEB
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu-version: ["20.04", "22.04", "24.04"]
        include:
          - ubuntu-version: "20.04"
            use-break-system-packages: false
          - ubuntu-version: "22.04"
            use-break-system-packages: false
          - ubuntu-version: "24.04"
            use-break-system-packages: true
    container:
      image: ubuntu:${{ matrix.ubuntu-version }}
    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git python3 python3-pip autoconf build-essential \
            flex bison libreadline-dev libncurses5-dev m4 \
            debhelper docbook-xsl quilt xsltproc linuxdoc-tools-latex opensp \
            texlive-latex-extra libssh-gcrypt-dev libgcrypt20-dev
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install apkg (Ubuntu 20.04/22.04)
        if: ${{ matrix.use-break-system-packages == false }}
        run: pip3 install apkg

      - name: Install apkg (Ubuntu 24.04)
        if: ${{ matrix.use-break-system-packages == true }}
        run: pip3 install --break-system-packages apkg

      - name: Build package
        run: apkg build

      - name: Create tarball
        run: |
          cd pkg/pkgs
          if [ -d "ubuntu-${{ matrix.ubuntu-version }}" ]; then
            tar -czf ubuntu-${{ matrix.ubuntu-version }}-packages.tar.gz ubuntu-${{ matrix.ubuntu-version }}/
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.ubuntu-version }}-packages
          path: pkg/pkgs/ubuntu-${{ matrix.ubuntu-version }}-packages.tar.gz
          if-no-files-found: error

  publish-image:
    name: Build BIRD image
    needs: build-packages
    runs-on: ubuntu-24.04
    concurrency:
      group: bird-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate image tag
        if: github.ref_type == 'tag'
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! $IMAGE_TAG =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $IMAGE_TAG" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-24.04-packages
          path: packages

      - name: Prepare image context
        run: |
          set -euo pipefail
          tar -xzf packages/ubuntu-24.04-packages.tar.gz -C packages
          debs=(packages/ubuntu-24.04/yanet-bird2_*/yanet-bird2_*_amd64.deb)
          if (( ${#debs[@]} != 1 )) || [[ ! -f ${debs[0]} ]]; then
            echo "Expected exactly one amd64 yanet-bird2 package" >&2
            exit 1
          fi
          mkdir image-context
          cp -- "${debs[0]}" image-context/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./image-context
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ github.ref_type == 'tag' && format('ghcr.io/yanet-platform/yanet2/bird:{0}', github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/yanet-platform/bird
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

  create-release:
    name: Create Release
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: bird-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ubuntu-*-packages
          path: artifacts

      - name: Generate notes only for new releases
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --jq '.[].tag_name')
          generate_notes=true
          while IFS= read -r tag; do
            if [[ $tag == "$RELEASE_TAG" ]]; then
              generate_notes=false
              break
            fi
          done <<< "$release_tags"
          echo "generate_notes=$generate_notes" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/ubuntu-20.04-packages/ubuntu-20.04-packages.tar.gz
            artifacts/ubuntu-22.04-packages/ubuntu-22.04-packages.tar.gz
            artifacts/ubuntu-24.04-packages/ubuntu-24.04-packages.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.notes.outputs.generate_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
